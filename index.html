<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; base-uri 'self'">
  <title>CIFEJ — Colegio de Ingenieros Forestales de Jalisco</title>
  <meta name="description" content="Colegio de Ingenieros Forestales del Estado de Jalisco. Más de 25 años promoviendo el manejo sustentable de bosques en Jalisco.">
  <meta name="author" content="Colegio de Ingenieros Forestales del Estado de Jalisco A.C.">
  <link rel="icon" type="image/x-icon" href="/img/favicon/favicon_multi.ico">
  <!-- Redirect de GitHub Pages (spa-github-pages) -->
  <script>
    ;(function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) { return s.replace(/~and~/g, '&') })
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) +
            decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') +
            l.hash
        )
      }
    })(window.location)
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
